name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Validate plugin manifest JSON
        run: python -m json.tool .codex-plugin/plugin.json

      - name: Smoke test CLI
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python scripts/scan_repo_harness.py --json | grep '"project_type": "codex-plugin"'
          python scripts/console.py fixture-test --json
          python scripts/console.py doctor --repo "$tmp" --domain "technical documentation" --phase new-project --json
          python scripts/console.py run-loop --repo "$tmp" --domain "technical documentation" --phase new-project --json
          python scripts/console.py loop --repo "$tmp" --domain "technical documentation" --phase new-project --json
          python scripts/console.py recommend-skills --repo "$tmp" --domain "technical documentation" --phase new-project --json
          python scripts/console.py catalog --repo "$tmp" --domain "technical documentation" --phase new-project --json
          python scripts/console.py run-loop --repo "$tmp" --domain "technical documentation" --phase high-risk --write-plan && exit 1 || test "$?" -eq 2
          python scripts/console.py run-loop --repo "$tmp" --domain "technical documentation" --phase new-project --write-plan
          test -f "$tmp/Docs/AI/harness-loop-plan.md"
          python scripts/console.py recommend-skills --repo "$tmp" --domain "technical documentation" --phase new-project --write-plan
          test -f "$tmp/Docs/AI/skill-recommendations.md"
          python scripts/console.py recommend-skills --repo "$tmp" --domain "technical documentation" --phase new-project --install && exit 1 || test "$?" -eq 2
          rec_install_root="$(mktemp -d)"
          python scripts/console.py recommend-skills --repo "$tmp" --domain "technical documentation" --phase new-project --install --confirm-install --skill-install-root "$rec_install_root"
          find "$rec_install_root" -name SKILL.md | grep .
          python scripts/console.py run-loop --repo "$tmp" --domain "technical documentation" --phase new-project --record-history --note "ci smoke"
          test -f "$tmp/Docs/AI/harness-history.jsonl"
          cat > "$tmp/eval-results.json" <<'JSON'
          {"results":[{"task_id":"ci","assertions":[{"text":"keeps validation focused","baseline":"fail","with_harness":"pass","evidence":"smoke"}]}]}
          JSON
          python scripts/console.py eval --repo "$tmp" --score "$tmp/eval-results.json" --write-score --note "ci score smoke" --json
          test -f "$tmp/Docs/AI/harness-eval-results.jsonl"
          python scripts/console.py diagnose --repo "$tmp" --phase new-project --json | grep '"eval_score_records": 1'
          python scripts/console.py patterns --json
          python scripts/console.py patterns --prompt background-review --repo "$tmp" --phase new-project --scope "validation drift"
          python scripts/console.py factory --repo "$tmp" --domain "technical documentation" --phase new-project --json
          python scripts/console.py factory --repo "$tmp" --domain "technical documentation" --phase new-project --write-artifacts
          python scripts/console.py factory --repo "$tmp" --domain "technical documentation" --phase new-project --write-codex-skills
          install_root="$(mktemp -d)"
          python scripts/console.py factory --repo "$tmp" --domain "technical documentation" --phase new-project --install-codex-skills --confirm-install --skill-install-root "$install_root"
          test -f "$tmp/Docs/AI/agent-team.md"
          test -f "$tmp/Docs/AI/team-orchestration.md"
          test -f "$tmp/Docs/AI/codex-skills/source-map/SKILL.md"
          test -f "$install_root/source-map/SKILL.md"
          python scripts/console.py bootstrap --repo "$tmp" --phase new-project --write
          python skills/codex-harness-setup/scripts/check_harness.py "$tmp" | grep 'Harness check passed'
          python scripts/console.py diagnose --repo "$tmp" --phase new-project --json
          python scripts/console.py tune --repo "$tmp" --phase new-project --dry-run --diff
