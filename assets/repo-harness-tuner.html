<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Harness Tuner</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    body {
      margin: 0;
      padding: 24px;
      line-height: 1.45;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 6px;
    }
    h2 {
      font-size: 18px;
      margin-top: 28px;
    }
    label {
      display: block;
      font-weight: 650;
      margin: 14px 0 6px;
    }
    input, select, textarea, button {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas);
      border-radius: 8px;
      background: Canvas;
      color: CanvasText;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    button {
      margin-top: 14px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      padding: 14px;
      border-radius: 8px;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
      overflow: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .note {
      color: color-mix(in srgb, CanvasText 70%, Canvas);
      margin-top: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Repo Harness Tuner</h1>
    <p class="note">Prototype UI for human involvement and harness-design prompt generation.</p>

    <section class="grid">
      <div>
        <label for="mode">Mode</label>
        <select id="mode">
          <option>Setup</option>
          <option>Audit only</option>
          <option>Targeted upgrade</option>
          <option>Recovery</option>
          <option>Ambiguity profiling</option>
        </select>
      </div>
      <div>
        <label for="repoType">Repository type</label>
        <input id="repoType" value="Vite + TypeScript + JSON game prototype">
      </div>
      <div>
        <label for="ambiguity">Human involvement: <span id="ambiguityValue">3</span>/5</label>
        <input id="ambiguity" type="range" min="1" max="5" value="3">
      </div>
    </section>

    <label for="modules">Module human-involvement overrides</label>
    <textarea id="modules">Content JSON: 4
Ending taxonomy: 2
Dependencies/build/release: 1
UI polish: 3</textarea>

    <section class="grid">
      <div>
        <label for="visible">Visible chats</label>
        <textarea id="visible">product decisions, roadmap changes, QA evidence, user-facing specialist work</textarea>
      </div>
      <div>
        <label for="background">Background workers</label>
        <textarea id="background">read-only audits, code review, test review, security review, static scans</textarea>
      </div>
    </section>

    <button id="generate">Generate prompt</button>

    <h2>Prompt</h2>
    <pre id="output"></pre>
  </main>

  <script>
    const ambiguity = document.querySelector("#ambiguity");
    const ambiguityValue = document.querySelector("#ambiguityValue");
    const output = document.querySelector("#output");

    function generate() {
      ambiguityValue.textContent = ambiguity.value;
      const moduleLines = document.querySelector("#modules").value
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => `- ${line}`)
        .join("\n") || "- No module overrides provided.";

      output.textContent = `Use the codex-harness-setup skill.

Mode: ${document.querySelector("#mode").value}
Repository type: ${document.querySelector("#repoType").value}
Human involvement: ${ambiguity.value}/5
Internal default ambiguity: ${6 - Number(ambiguity.value)}

Module overrides:
${moduleLines}

Inspect existing AGENTS.md, Docs/AI/*, docs/ai/*, README, package scripts, CI/hooks, and project coordination docs.
Create or update only the smallest useful repo-local harness.
Prefer AGENTS.md, Docs/AI/harness-profile.md, and Docs/AI/validation.md when they reduce real future-agent risk.
Do not add CI gates, release gates, dependencies, or destructive scripts without explicit approval.

Parallel work visibility policy:
- Visible chats: ${document.querySelector("#visible").value}
- Background workers: ${document.querySelector("#background").value}
- Single agent is preferred for small, low-risk changes.

Human involvement policy:
- Human involvement 5: stop and ask for explicit approval before edits.
- Human involvement 4: ask 1-3 focused questions before edits unless a named repo source of truth already answers them.
- Human involvement 3: infer from repo context, but ask before hard-to-reverse or user-visible direction changes.
- Human involvement 2: proceed from existing patterns; mention assumptions in closeout.
- Human involvement 1: explore autonomously unless a protected area or explicit approval trigger appears.

Close out with changed files, validation, skipped checks with reasons, and remaining risks.`;
    }

    document.querySelector("#generate").addEventListener("click", generate);
    ambiguity.addEventListener("input", generate);
    generate();
  </script>
</body>
</html>
